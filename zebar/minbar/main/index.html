<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="./styles.css" />
		<script
			src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
			crossorigin="anonymous">
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="text/babel" data-type="module">
			import React, { useState, useEffect } from "https://esm.sh/react@18?dev";
			import { createRoot } from "https://esm.sh/react-dom@18/client?dev";
			import * as zebar from "https://esm.sh/zebar@3.0";
			// Providers
			const providers = zebar.createProviderGroup({
				glazewm: { type: "glazewm" },
				date: { type: "date", formatting: "h:mm" },
			});
			// Components
			function Workspaces({ glazewm }) {
				if (!glazewm) return null;
				return (
					<div className="workspaces">
						{glazewm.currentWorkspaces.map((workspace) => (
							<div
								key={workspace.name}
								className={
									workspace.hasFocus
										? "workspace focused"
										: "workspace"
								}
							>
								{workspace.displayName ?? workspace.name}
							</div>
						))}
					</div>
				);
			}
			function Clock({ date, glazewm }) {
				const direction =
					glazewm?.tilingDirection === "horizontal";
				return (
					<div
						className="clock"
						style={{
							background: direction
								? "#0000ff44"
								: "#ff000044",
						}}
					>
						{date?.formatted}
					</div>
				);
			}
			function Battery({ battery, onAC }) {
				const level = parseInt(battery, 10);
				if (onAC) {
					return (
						<div
							className="battery"
							style={{ background: "#0000ff44" }}
						>
							AC
						</div>
					);
				}
				if (!isNaN(level) && level < 20) {
					return (
						<div
							className="battery low"
							style={{ background: "#ff000044" }}
						>
							{battery}
						</div>
					);
				}
				return null;
			}
			// App
			function App() {
				const [output, setOutput] = useState(providers.outputMap);
				const [battery, setBattery] = useState("--");
				const [onAC, setOnAC] = useState(false);
				async function updateBattery() {
					try {
						const result = await zebar.shellExec(
							"powershell.exe",
							[
								"-NoProfile",
								"-Command",
								'$b=Get-CimInstance Win32_Battery;',
								'if($b){"$($b.EstimatedChargeRemaining),$($b.BatteryStatus)"}',
							]
						);
						if (result.code === 0) {
							const [level, status] = result.stdout.trim().split(",");
							setBattery(level || "--");
							// BatteryStatus = 2 means charging/on AC
							console.log(result.stdout);
							console.log("status =", Number(status.trim()));
							setOnAC([2, 3].includes(Number(status.trim())));
						}
					} catch (error) {
						console.error("Battery error:", error);
						setBattery("--");
						setOnAC(false);
					}
				}
				useEffect(() => {
					providers.onOutput(() => {
						setOutput({ ...providers.outputMap });
					});
					updateBattery();
					const interval = setInterval(updateBattery, 3000);
					return () => clearInterval(interval);
				}, []);
				return (
					<div className="app">
						<div className="left">
							<Workspaces glazewm={output.glazewm} />
						</div>
						<div className="center">
							<Clock
								date={output.date}
								glazewm={output.glazewm}
							/>
						</div>
						<div className="right">
							<Battery
								battery={battery}
								onAC={onAC}
							/>
						</div>
					</div>
				);
			}
			createRoot(document.getElementById("root")).render(<App />);
		</script>
	</body>
</html>
